name: CI

on:
  push:
    # plano-*: o branch de cada plano passa pela esteira (E2E e Docker) antes do merge no main.
    branches: [main, "plano-*"]
  pull_request:

# Só leitura: o CI não publica nada.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    # Este job não abre o app: o binário do Electron não precisa ser baixado.
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # O pacote electron não baixa o binário ao instalar; baixa aqui, antes dos testes.
      - run: node packages/app/node_modules/electron/install.js
      - run: pnpm --filter @workforces/e2e exec playwright install-deps chromium
      # O Ubuntu 24 bloqueia o namespace que o sandbox do Electron usa; no runner descartável, libera.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-falhas
          path: packages/e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t workforces:ci .
      - name: A imagem sobe saudável, sem root, serve a API, o mapa e a página do convite, e avisa que está sem HTTPS
        run: |
          docker run -d --name wf --health-interval=2s -p 127.0.0.1:4600:4600 -e WF_PUBLIC_URL=http://localhost:4600 workforces:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4600/api/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/api/me)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/)" = 404
          curl -fsS http://127.0.0.1:4600/invite/convite-de-teste | grep -q "workforces://invite"
          curl -fsS -o /dev/null http://127.0.0.1:4600/map/map.tmj
          docker logs wf 2>&1 | grep -q "convite de admin"
          [ "$(docker exec wf id -u)" -ne 0 ]
          docker logs wf 2>&1 | grep -q "sem HTTPS"
          for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' wf)" = healthy ] && break; sleep 2; done
          test "$(docker inspect -f '{{.State.Health.Status}}' wf)" = healthy
      - name: O compose de exemplo é válido
        run: |
          WF_DOMAIN=escritorio.exemplo docker compose -f deploy/docker-compose.yml config --quiet
          WF_DOMAIN=escritorio.interno docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.internal.yml config --quiet
      - name: A variante de rede interna entrega o pino da CA do Caddy e o põe no convite de admin
        working-directory: deploy
        env:
          WF_DOMAIN: escritorio.interno
        run: |
          compose="docker compose -f docker-compose.yml -f docker-compose.internal.yml"
          $compose up -d --build
          for i in $(seq 1 90); do
            code=$(curl -sk --resolve escritorio.interno:443:127.0.0.1 -o anchor.json -w '%{http_code}' https://escritorio.interno/api/tls/anchor || true)
            [ "$code" = 200 ] && break; sleep 2
          done
          test "$code" = 200
          python3 -c 'import json; print(json.load(open("anchor.json"))["anchor"])' > anchor.pem
          $compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          pin=$(openssl x509 -in root.crt -outform der | openssl dgst -sha256 -binary | basenc --base64url | tr -d '=')
          test "$(openssl x509 -in anchor.pem -outform der | openssl dgst -sha256 -binary | basenc --base64url | tr -d '=')" = "$pin"
          for i in $(seq 1 15); do $compose logs workforces | grep -q "pin=$pin" && break; sleep 2; done
          $compose logs workforces | grep -q "pin=$pin"
      - name: Desliga a variante de rede interna
        if: always()
        working-directory: deploy
        env:
          WF_DOMAIN: escritorio.interno
        run: docker compose -f docker-compose.yml -f docker-compose.internal.yml down -v || true
      - name: Log do container (se algo falhou)
        if: failure()
        run: docker logs wf || true
