name: CI

on:
  push:
    # plano-*: o branch de cada plano passa pela esteira (E2E e Docker) antes do merge no main.
    branches: [main, "plano-*"]
  pull_request:

# Só leitura: o CI não publica nada.
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @workforces/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-falhas
          path: packages/e2e/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t workforces:ci .
      - name: A imagem sobe, serve o escritório e imprime o convite de admin
        run: |
          docker run -d --name wf -p 127.0.0.1:4600:4600 -e WF_PUBLIC_URL=http://localhost:4600 workforces:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:4600/ && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4600/api/me)" = 401
          curl -fsS http://127.0.0.1:4600/ | grep -q WorkForces
          curl -fsS -o /dev/null http://127.0.0.1:4600/map/map.tmj
          docker logs wf 2>&1 | grep -q "convite de admin"
      - name: O compose de exemplo é válido
        run: WF_DOMAIN=escritorio.exemplo docker compose -f deploy/docker-compose.yml config --quiet
