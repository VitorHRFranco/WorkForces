name: GIF do README

# Grava a demonstração do README num runner do GitHub (o app desenha o jogo por software e pesa na CPU).
# Rode pela aba Actions ("Run workflow") e baixe o artefato "demo-gif"; o GIF vai em docs/media/demo.gif.
on:
  workflow_dispatch:
    inputs:
      scale:
        description: "escala do GIF (1 = tamanho da janela gravada)"
        default: "1"
      speed:
        description: "velocidade da reprodução (1 = tempo real)"
        default: "1.5"

permissions:
  contents: read

jobs:
  gif:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install pillow==12.3.0
      - run: npm install -g pnpm@12.11.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # O pacote electron não baixa o binário ao instalar; baixa aqui, antes da gravação.
      - run: node packages/app/node_modules/electron/install.js
      - run: pnpm --filter @workforces/e2e exec playwright install-deps chromium
      # O Ubuntu 24 bloqueia o namespace que o sandbox do Electron usa; no runner descartável, libera.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a pnpm demo
        env:
          WF_GIF_SCALE: ${{ inputs.scale }}
          WF_GIF_SPEED: ${{ inputs.speed }}
      - uses: actions/upload-artifact@v7
        with:
          name: demo-gif
          path: docs/media/demo.gif
          retention-days: 14
